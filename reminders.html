<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>التذكيرات | ASGate PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="./main.css">
<link rel="stylesheet" href="./reminders.css">
<style>
html,body{overflow-x:hidden; width:100%; max-width:100vw; margin:0; padding:0;}
#navbarPlaceholder{height:52px; min-height:52px; max-height:52px; width:100%; max-width:100vw; overflow:hidden; box-sizing:border-box; background:#fff; border-bottom:1px solid #e2e8f0;}
.dashboard-container{display:flex; flex-direction:column; height:100vh; width:100%; max-width:100vw; overflow:hidden; box-sizing:border-box;}
</style>
</head>
<body>

<div class="dashboard-container">
<div id="navbarPlaceholder">
<nav class="top-navbar" data-unified="true">
<div style="display:flex; align-items:center; gap:12px; height:100%; min-width:0; flex:1;">
<div class="nav-brand"><i class="fas fa-layer-group" style="color:#10b981;"></i> ASGate <span style="background:#10b981; color:#fff; font-size:8px; padding:1px 5px; border-radius:8px;">PRO</span></div>
<ul class="nav-links">
<li><a href="./index.html"><i class="fas fa-chart-pie"></i> الرئيسية</a></li>
<li><a href="./visits.html"><i class="fas fa-route"></i> الزيارات</a></li>
<li><a href="./opportunities.html"><i class="fas fa-bullseye"></i> الفرص</a></li>
<li><a href="./customers.html"><i class="fas fa-building"></i> العملاء</a></li>
<li><a href="./sales.html"><i class="fas fa-bag-shopping"></i> المبيعات</a></li>
<li><a href="./reminders.html" class="active"><i class="fas fa-bell"></i> التذكيرات</a></li>
</ul>
</div>
<div style="display:flex; align-items:center; gap:8px; height:100%; flex-shrink:0;">
<div class="nav-search-container">
<div class="nav-search-input-wrapper"><i class="fas fa-search search-icon"></i><input type="text" id="globalSearchInput" placeholder="بحث..."></div>
<div id="searchResults" class="search-results-dropdown"></div>
</div>
<div class="nav-actions"><button class="nav-btn" id="darkModeToggle" title="الوضع الليلي"><i class="fas fa-moon"></i></button><div style="width:28px; height:28px; background:linear-gradient(135deg,#0a3a22,#10b981); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:11px;">H</div></div>
</div>
</nav>
</div>

<div class="reminders-container">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap;">
<h3 style="margin:0; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;"><i class="fas fa-bell" style="color:#f59e0b;"></i> التذكيرات الذكية <span style="background:#fef3c7; color:#92400e; font-size:9px; padding:2px 6px; border-radius:10px;">12 مذكرة</span></h3>
<span style="font-size:10px; color:#64748b; font-weight:600;"><i class="fas fa-circle" style="font-size:6px; color:#10b981;"></i> متزامن مع السحابة</span>
</div>
<div class="reminders-grid" id="remindersGrid"></div>
</div>
</div>

<div class="calendar-overlay" id="calendarOverlay">
<div class="custom-datepicker">
<div class="datepicker-header">
<div class="month-nav">
<i class="fas fa-chevron-left month-nav-btn" id="prevMonthBtn" title="السابق"></i>
<select id="calMonthSelect" class="datepicker-select"></select>
<i class="fas fa-chevron-right month-nav-btn" id="nextMonthBtn" title="التالي"></i>
</div>
<select id="calYearSelect" class="datepicker-select"></select>
</div>
<div class="weekdays-grid"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span class="weekend-day">Fr</span><span class="weekend-day">Sa</span></div>
<div class="days-container"><div class="days-grid" id="calDaysGrid"></div></div>
<div class="datepicker-footer">
<button class="btn-cancel" id="calCancelBtn">إلغاء</button>
<div class="action-buttons"><button class="btn-clear-date" id="calClearBtn">مسح</button><button class="btn-next" id="calNextBtn">تأكيد</button></div>
</div>
</div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
<div class="confirm-modal">
<h3 style="margin-top:0; font-family:'Cairo'; color:#0f172a; font-size:13px;">تأكيد الحذف</h3>
<p style="font-family:'Cairo'; font-size:11px; color:#475569;">هل أنت متأكد من حذف هذه المذكرة؟</p>
<div class="confirm-actions">
<button class="btn-cancel-delete" id="cancelDeleteBtn">إلغاء</button>
<button class="btn-confirm-delete" id="confirmDeleteBtn">حذف</button>
</div>
</div>
</div>

<script type="module" src="./navbar.js"></script>
<script type="module" src="./reminders.js"></script>
</body>
</html>
